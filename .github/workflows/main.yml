name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Normalize version
        run: |
          V="${INPUT_VERSION#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $INPUT_VERSION (expected v1.2.3)"; exit 1
          fi
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "Tag v$V already exists"; exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bump version (package.json, package-lock.json, src/types.ts)
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i -E "s/export const CARD_VERSION = \"[^\"]*\";/export const CARD_VERSION = \"$VERSION\";/" src/types.ts
          grep -q "CARD_VERSION = \"$VERSION\"" src/types.ts

      - name: Build card
        run: |
          npm run build
          grep -q "$VERSION" simple-vertical-slider.js

      - name: Commit, tag and push
        run: |
          git add package.json package-lock.json src/types.ts simple-vertical-slider.js
          git diff --cached --quiet || git commit -m "Release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" simple-vertical-slider.js --title "$TAG" --generate-notes
